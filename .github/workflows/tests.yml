name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
          - php: '8.3'
            laravel: '^12.0'
          - php: '8.3'
            laravel: '^13.0'
          - php: '8.4'
            laravel: '^13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring, sqlite3
          coverage: none
          tools: composer:v2
      - name: Validate package
        run: composer validate --strict
      - name: Select Laravel version
        run: composer require --dev "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-progress --no-update
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
      - name: Audit production dependencies
        run: composer audit --locked --no-dev
      - name: Unit and integration tests
        run: composer test
      - name: Standalone core smoke checks
        run: composer smoke
      - name: Static analysis
        run: composer analyse
      - name: Code style
        run: composer format-check

  consumer:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install and exercise package in a fresh Laravel 13 application
        run: bash tools/consumer-smoke.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')
    needs: [test, consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#release/}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; nothing to do."
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "Laravel LeakProof $version" --generate-notes
